<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NodeLx — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: #141414;
      border: 1px solid #242424;
      border-radius: 14px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.375rem;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      background: #3b82f6;
      border-radius: 50%;
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-name span { color: #3b82f6; }

    .subtitle {
      font-size: 0.8125rem;
      color: #555;
      margin-bottom: 2rem;
      padding-left: 1.25rem;
    }

    .field { margin-bottom: 1.125rem; }

    label {
      display: block;
      font-size: 0.8125rem;
      color: #888;
      margin-bottom: 0.375rem;
      font-weight: 500;
    }

    input {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #242424;
      border-radius: 7px;
      color: #e5e5e5;
      padding: 0.625rem 0.875rem;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }

    input::placeholder { color: #333; }

    .btn {
      width: 100%;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 7px;
      padding: 0.75rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      margin-top: 0.5rem;
    }

    .btn:hover:not(:disabled) { background: #2563eb; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-box {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      color: #fca5a5;
      border-radius: 7px;
      padding: 0.625rem 0.875rem;
      font-size: 0.8125rem;
      margin-bottom: 1.125rem;
      display: none;
      line-height: 1.4;
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #333;
    }

    .footer strong { color: #444; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-dot"></div>
      <div class="brand-name">Node<span>Lx</span></div>
    </div>
    <div class="subtitle">TexasWebService — Website Manager</div>

    <div class="error-box" id="errorBox"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          value="max@amarketology.com"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>
      <button type="submit" class="btn" id="submitBtn">Sign In</button>
    </form>

    <div class="footer">
      <strong>NodeLx</strong> · Powered by TexasWebService
    </div>
  </div>

  <script>
    const form      = document.getElementById('loginForm');
    const errorBox  = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    // If already authenticated, redirect immediately
    fetch('/api/auth/me', { credentials: 'include' })
      .then(r => r.ok ? r.json() : null)
      .then(user => {
        if (user) {
          window.location.href = user.role === 'developer' ? '/admin/dev' : '/admin/editor';
        }
      })
      .catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (res.ok) {
          window.location.href = data.role === 'developer' ? '/admin/dev' : '/admin/editor';
        } else {
          showError(data.error || 'Login failed. Please try again.');
        }
      } catch (err) {
        showError('Network error. Is the server running?');
      }
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  </script>
</body>
</html>
